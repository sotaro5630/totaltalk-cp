<!DOCTYPE html>
<html lang="ja">
 
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
 
<title>ツアー予約</title>
 
<link rel="stylesheet"
href="css/style.css">
 
</head>
 
<body>
 
<div class="container">
 
<h1>🎉 ツアー予約 🎉</h1>
 
<input
id="name"
placeholder="名前">
 
<input
id="people"
type="number"
min="1"
max="15"
placeholder="人数">
 
<select id="tourSelect">
 
</select>
 
<div id="tourTable"></div>
 
<button
class="reserveBtn"
onclick="reserve()">
 
予約送信
 
</button>
 
<div id="result"></div>
 
</div>
 
<script src="js/app.js"></script>
 
</body>
</html>
